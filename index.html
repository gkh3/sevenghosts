<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Ranker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111114;
      --surface: #1c1c21;
      --card: #ffffff;
      --accent: #6C63FF;
      --accent-glow: rgba(108, 99, 255, 0.35);
      --text: #f0f0f5;
      --muted: #888896;
      --border: #2a2a35;
      --win-green: #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 24px 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .progress-bar-wrap {
      width: min(480px, 90vw);
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── ARENA ─────────────────────────────────────────── */
    #arena {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      gap: 20px;
    }

    .vs-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      width: min(820px, 96vw);
    }

    .card-wrap {
      flex: 1;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: var(--surface);
      border: 2px solid var(--border);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }

    .card-wrap:hover {
      transform: translateY(-6px) scale(1.012);
      border-color: var(--accent);
      box-shadow: 0 8px 40px var(--accent-glow);
    }

    .card-wrap.chosen {
      border-color: var(--win-green);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
      transform: scale(1.03);
    }

    .card-wrap.unchosen {
      opacity: 0.38;
      transform: scale(0.97);
    }

    .card-wrap img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-label {
      padding: 12px 16px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .vs-divider {
      width: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--border);
      letter-spacing: 0.08em;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── LEADERBOARD ──────────────────────────────────── */
    #leaderboard {
      width: min(560px, 94vw);
      margin: 0 auto 64px;
      display: none;
    }

    #leaderboard h2 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      text-align: center;
    }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .lb-item:hover { border-color: var(--accent); }

    .lb-rank {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }

    .lb-rank.top { color: var(--accent); }

    .lb-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }

    .lb-info { flex: 1; min-width: 0; }

    .lb-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-elo {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .lb-bar-wrap {
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lb-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ── LOCKED LEADERBOARD ───────────────────────────── */
    #lb-locked {
      width: min(560px, 94vw);
      margin: 0 auto 64px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }

    #lb-locked p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
    #lb-locked strong { color: var(--text); }

    /* ── RESET ────────────────────────────────────────── */
    #reset-btn {
      display: block;
      margin: 0 auto 32px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, color 0.2s;
    }

    #reset-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── CONFIG NOTICE ────────────────────────────────── */
    #config-notice {
      background: rgba(108,99,255,0.12);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 10px;
      padding: 18px 24px;
      max-width: min(820px, 96vw);
      margin: 8px auto 0;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #ccc;
    }

    #config-notice code {
      background: rgba(255,255,255,0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    #config-notice strong { color: var(--text); }

    @media (max-width: 580px) {
      .card-wrap img { height: 200px; }
      .vs-divider { width: 28px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     ✏️  CONFIGURATION — edit this section to set up your images
     ═══════════════════════════════════════════════════════ -->
<script>
  // 1. Replace these with your actual image paths or URLs.
  //    Paths are relative to index.html, e.g. "images/photo1.jpg"
  //    Or use full URLs: "https://example.com/photo.jpg"
  const IMAGE_LIST = [
    { id: "img1",  src: "images/01.jpg", label: "Image 1" },
    { id: "img2",  src: "images/02.jpg", label: "Image 2" },
    { id: "img3",  src: "images/03.jpg", label: "Image 3" },
    { id: "img4",  src: "images/04.jpg", label: "Image 4" },
    { id: "img5",  src: "images/05.jpg", label: "Image 5" },
    // ... add all ~40 images here following the same pattern
  ];

  // 2. How many comparisons before the leaderboard unlocks?
  //    Recommended: at least 1.5–2× the number of images (e.g. 60–80 for 40 images)
  const MIN_COMPARISONS = 60;

  // 3. ELO K-factor — higher = faster rating changes (32 is standard)
  const K_FACTOR = 32;

  // 4. Page title shown in the header
  const PAGE_TITLE = "Which do you prefer?";
</script>
<!-- ═══════════════════════════════════════════════════════ -->

<header>
  <h1 id="page-title"></h1>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label"></div>
</header>

<div id="config-notice">
  <strong>👋 Setup reminder:</strong> Edit the <code>IMAGE_LIST</code> array at the top of this file to add your images,
  then put your image files in an <code>images/</code> folder next to <code>index.html</code>.
  Remove this notice when you're ready to share. See the <strong>README.md</strong> for full instructions.
</div>

<section id="arena">
  <div class="vs-row">
    <div class="card-wrap" id="card-a" onclick="pick('a')">
      <img id="img-a" src="" alt="Option A" />
      <div class="card-label" id="label-a"></div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="card-wrap" id="card-b" onclick="pick('b')">
      <img id="img-b" src="" alt="Option B" />
      <div class="card-label" id="label-b"></div>
    </div>
  </div>
  <p class="hint">Click the image you prefer</p>
</section>

<div id="lb-locked">
  <p id="lb-locked-text"></p>
</div>

<div id="leaderboard">
  <h2>Rankings</h2>
  <div id="lb-list"></div>
</div>

<button id="reset-btn" onclick="resetAll()">Reset all comparisons</button>

<script>
  // ── State ──────────────────────────────────────────────
  const STORAGE_KEY = 'elo_ranker_v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function initState() {
    const ratings = {};
    const comparisons = {};
    IMAGE_LIST.forEach(img => {
      ratings[img.id] = 1000;
      comparisons[img.id] = 0;
    });
    return { ratings, comparisons, totalComparisons: 0, history: [] };
  }

  // ── ELO ───────────────────────────────────────────────
  function expected(ra, rb) {
    return 1 / (1 + Math.pow(10, (rb - ra) / 400));
  }

  function updateElo(state, winnerId, loserId) {
    const ra = state.ratings[winnerId];
    const rb = state.ratings[loserId];
    const ea = expected(ra, rb);
    state.ratings[winnerId] = Math.round(ra + K_FACTOR * (1 - ea));
    state.ratings[loserId]  = Math.round(rb + K_FACTOR * (0 - (1 - ea)));
    state.comparisons[winnerId] = (state.comparisons[winnerId] || 0) + 1;
    state.comparisons[loserId]  = (state.comparisons[loserId]  || 0) + 1;
    state.totalComparisons = (state.totalComparisons || 0) + 1;
    state.history = state.history || [];
    state.history.push({ w: winnerId, l: loserId });
  }

  // ── Pair selection ─────────────────────────────────────
  // Prioritise images with fewer comparisons; break ties randomly
  function selectPair(state) {
    const ids = IMAGE_LIST.map(i => i.id);
    ids.sort((a, b) => {
      const diff = (state.comparisons[a] || 0) - (state.comparisons[b] || 0);
      return diff !== 0 ? diff : Math.random() - 0.5;
    });

    // Pick the least-compared image, then find a partner it hasn't faced recently
    const a = ids[0];
    const recentOpponents = new Set(
      (state.history || []).slice(-20)
        .filter(h => h.w === a || h.l === a)
        .map(h => h.w === a ? h.l : h.w)
    );

    let b = null;
    for (let i = 1; i < ids.length; i++) {
      if (!recentOpponents.has(ids[i])) { b = ids[i]; break; }
    }
    if (!b) b = ids[1]; // fallback

    return [a, b];
  }

  // ── Render ─────────────────────────────────────────────
  let state;
  let currentPair = [];

  function getImageById(id) {
    return IMAGE_LIST.find(i => i.id === id);
  }

  function renderPair() {
    const [aId, bId] = selectPair(state);
    currentPair = [aId, bId];

    const imgA = getImageById(aId);
    const imgB = getImageById(bId);

    document.getElementById('img-a').src   = imgA.src;
    document.getElementById('img-a').alt   = imgA.label;
    document.getElementById('label-a').textContent = imgA.label;
    document.getElementById('img-b').src   = imgB.src;
    document.getElementById('img-b').alt   = imgB.label;
    document.getElementById('label-b').textContent = imgB.label;

    document.getElementById('card-a').className = 'card-wrap';
    document.getElementById('card-b').className = 'card-wrap';
  }

  function renderProgress() {
    const total = state.totalComparisons || 0;
    const pct = Math.min(100, Math.round((total / MIN_COMPARISONS) * 100));
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent =
      total < MIN_COMPARISONS
        ? `${total} / ${MIN_COMPARISONS} comparisons to unlock rankings`
        : `${total} comparisons — rankings live`;
  }

  function renderLeaderboard() {
    const total = state.totalComparisons || 0;
    const locked = document.getElementById('lb-locked');
    const lb     = document.getElementById('leaderboard');

    if (total < MIN_COMPARISONS) {
      locked.style.display = 'block';
      lb.style.display     = 'none';
      document.getElementById('lb-locked-text').innerHTML =
        `Rankings unlock after <strong>${MIN_COMPARISONS} comparisons</strong>.<br>
         You've done <strong>${total}</strong> so far — keep going!`;
      return;
    }

    locked.style.display = 'none';
    lb.style.display     = 'block';

    const sorted = IMAGE_LIST
      .map(img => ({ ...img, elo: state.ratings[img.id], count: state.comparisons[img.id] || 0 }))
      .sort((a, b) => b.elo - a.elo);

    const maxElo = sorted[0].elo;
    const minElo = sorted[sorted.length - 1].elo;
    const range  = maxElo - minElo || 1;

    const list = document.getElementById('lb-list');
    list.innerHTML = sorted.map((img, i) => {
      const barPct = Math.round(((img.elo - minElo) / range) * 100);
      const rankClass = i < 3 ? 'lb-rank top' : 'lb-rank';
      return `
        <div class="lb-item">
          <div class="${rankClass}">#${i+1}</div>
          <img class="lb-thumb" src="${img.src}" alt="${img.label}" />
          <div class="lb-info">
            <div class="lb-name">${img.label}</div>
            <div class="lb-elo">ELO ${img.elo} &middot; ${img.count} votes</div>
          </div>
          <div class="lb-bar-wrap">
            <div class="lb-bar-fill" style="width:${barPct}%"></div>
          </div>
        </div>`;
    }).join('');
  }

  function pick(side) {
    const winnerId = side === 'a' ? currentPair[0] : currentPair[1];
    const loserId  = side === 'a' ? currentPair[1] : currentPair[0];

    document.getElementById('card-a').className =
      'card-wrap ' + (side === 'a' ? 'chosen' : 'unchosen');
    document.getElementById('card-b').className =
      'card-wrap ' + (side === 'b' ? 'chosen' : 'unchosen');

    updateElo(state, winnerId, loserId);
    saveState(state);

    setTimeout(() => {
      renderPair();
      renderProgress();
      renderLeaderboard();
    }, 420);
  }

  function resetAll() {
    if (!confirm('Reset all comparisons and ratings? This cannot be undone.')) return;
    state = initState();
    saveState(state);
    renderPair();
    renderProgress();
    renderLeaderboard();
  }

  // ── Boot ───────────────────────────────────────────────
  document.getElementById('page-title').textContent = PAGE_TITLE;

  const saved = loadState();
  if (saved &&
      Object.keys(saved.ratings || {}).length === IMAGE_LIST.length &&
      IMAGE_LIST.every(img => img.id in (saved.ratings || {}))) {
    state = saved;
  } else {
    state = initState();
    saveState(state);
  }

  renderPair();
  renderProgress();
  renderLeaderboard();
</script>

</body>
</html>
